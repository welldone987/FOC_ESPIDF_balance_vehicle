<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>平衡车 · 遥控</title>
<style>
:root{color-scheme:light;--ink:#183831;--paper:#f5f3ec;--line:#d4d9cf;--green:#22634f}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei UI","PingFang SC",sans-serif}main{max-width:480px;margin:auto;padding:40px 28px 28px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:24px}h1{font-size:27px;letter-spacing:.08em;margin:0}header small{display:block;font:11px Consolas,monospace;letter-spacing:.18em;margin-top:9px}button{font:inherit;border:1px solid var(--green);border-radius:6px;padding:11px 18px;background:var(--green);color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,#pad:focus-visible{outline:3px solid #cc8b36;outline-offset:5px}#status{min-height:42px;font-size:13px;line-height:1.6;margin:20px 0;color:#52665c}.directions{text-align:center;font-size:12px;color:#66766a;letter-spacing:.18em}#pad{width:min(100%,300px);aspect-ratio:1;margin:16px auto;position:relative;border:1px solid #bbc8ba;border-radius:50%;touch-action:none;user-select:none;background:linear-gradient(transparent calc(50% - .5px),#d7ded3 50%,transparent calc(50% + .5px)),linear-gradient(90deg,transparent calc(50% - .5px),#d7ded3 50%,transparent calc(50% + .5px));background-color:#e9ede3;outline-offset:7px}#pad[aria-disabled="true"]{opacity:.45}#pad::before{content:"";position:absolute;inset:22%;border:1px dashed #c1cdbd;border-radius:50%}#knob{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px;border-radius:50%;background:var(--green);box-shadow:0 5px 0 #174837,0 8px 16px #18383120;pointer-events:none}#knob::after{content:"+";display:grid;place-items:center;height:100%;color:#c8dfc7;font:24px Consolas,monospace}.readout{display:flex;justify-content:space-between;margin-top:32px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.readout label{font-size:12px;color:#617268}.readout output{display:block;margin-top:8px;font:28px Consolas,monospace}.readout span{font-size:13px}footer{font-size:12px;line-height:1.9;color:#617268;margin-top:20px}footer p{margin:5px 0}@media(max-height:650px){main{padding-top:20px}#pad{width:230px}.readout{margin-top:18px}}
</style>
</head>
<body><main>
<header><div><h1>平衡车</h1><small>VELOCITY / DIRECTION</small></div><button id="connect">连接蓝牙</button></header>
<p id="status" role="status" aria-live="polite">连接后，按住摇杆控制。</p>
<div class="directions">前进</div>
<div id="pad" role="application" tabindex="0" aria-label="方向摇杆；按住拖动，或按住方向键，松开归零" aria-disabled="true"><div id="knob"></div></div>
<div class="directions">后退</div>
<div class="readout"><div><label>速度目标</label><output id="speed">0 <span>%</span></output></div><div><label>转向目标 · 左 / 右</label><output id="direction">0 <span>%</span></output></div></div>
<footer><p>松手归零，保持零速平衡。失焦或切到后台会归零。</p><p>数值为发送目标；本页不回传车辆状态。</p></footer>
</main>
<script>
'use strict';
const SERVICE='6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const COMMAND='6e400006-b5a3-f393-e0a9-e50e24dcca9e';
const button=document.getElementById('connect'),status=document.getElementById('status');
const pad=document.getElementById('pad'),knob=document.getElementById('knob');
const speed=document.getElementById('speed'),direction=document.getElementById('direction');
let session=null,connecting=false,generation=0,pointer=null,x=0,y=0;
const keys=new Set();
function render(){
 speed.innerHTML=`${y} <span>%</span>`;direction.innerHTML=`${x} <span>%</span>`;
 const r=pad.getBoundingClientRect().width/2-34;
 knob.style.transform=`translate(${x*r/100}px,${-y*r/100}px)`;
}
function center(){pointer=null;keys.clear();x=y=0;render();}
function close(message='蓝牙已断开。'){
 ++generation;const old=session;session=null;center();
 if(old){clearInterval(old.timer);old.device.gatt.disconnect();}
 button.disabled=false;button.textContent='连接蓝牙';pad.setAttribute('aria-disabled','true');status.textContent=message;
}
async function flush(s){
 if(s!==session||s.busy)return;
 s.busy=true;
 try{
  do{
   const zero=s.zero;s.zero=false;
   const data=new TextEncoder().encode(`D,${s.sequence},${zero?0:x},${zero?0:y}`);
   s.sequence=(s.sequence+1)&65535;
   let deadline;
   try{
    await Promise.race([s.characteristic.writeValueWithResponse(data),new Promise((_,reject)=>{deadline=setTimeout(()=>reject(new Error('写入超时')),200);})]);
   }finally{clearTimeout(deadline);}
  }while(s===session&&s.zero);
 }catch(error){if(s===session)close(`连接中断：${error.message}`);}
 finally{s.busy=false;}
}
function zero(){center();if(session){session.zero=true;void flush(session);}}
async function connect(){
 if(session){zero();close();return;}
 if(connecting)return;
 if(!navigator.bluetooth){status.textContent='请使用支持 Web Bluetooth 的浏览器，并通过 HTTPS 或 localhost 打开。';return;}
 connecting=true;button.disabled=true;status.textContent='正在连接…';const token=++generation;let device;
 try{
  device=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE]}]});
  if(token!==generation||document.hidden)return;
  const server=await device.gatt.connect();
  if(token!==generation||document.hidden){device.gatt.disconnect();return;}
  const service=await server.getPrimaryService(SERVICE);
  const characteristic=await service.getCharacteristic(COMMAND);
  if(token!==generation||document.hidden){device.gatt.disconnect();return;}
  const s={device,characteristic,sequence:0,busy:false,zero:true,timer:null};session=s;
  device.addEventListener('gattserverdisconnected',()=>{if(session===s)close();});
  center();pad.setAttribute('aria-disabled','false');button.textContent='断开连接';status.textContent='已连接 · 按住摇杆移动，松手归零';
  s.timer=setInterval(()=>void flush(s),50);await flush(s);
 }catch(error){if(device?.gatt.connected)device.gatt.disconnect();if(token===generation)close(`连接失败：${error.message}`);}
 finally{connecting=false;button.disabled=false;}
}
function move(event){
 const rect=pad.getBoundingClientRect(),r=rect.width/2-34;
 let dx=event.clientX-rect.left-rect.width/2,dy=rect.top+rect.height/2-event.clientY;
 const scale=Math.max(1,Math.hypot(dx,dy)/r);
 x=Math.round(dx/scale/r*100);y=Math.round(dy/scale/r*100);render();
}
button.addEventListener('click',()=>void connect());
pad.addEventListener('pointerdown',event=>{if(!session||document.hidden||pointer!==null||event.button!==0)return;event.preventDefault();keys.clear();pointer=event.pointerId;pad.setPointerCapture(pointer);move(event);});
pad.addEventListener('pointermove',event=>{if(pointer===event.pointerId)move(event);});
for(const name of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(name,event=>{if(pointer===event.pointerId)zero();});
pad.addEventListener('keydown',event=>{if(!session||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();keys.add(event.key);x=(Number(keys.has('ArrowRight'))-Number(keys.has('ArrowLeft')))*50;y=(Number(keys.has('ArrowUp'))-Number(keys.has('ArrowDown')))*50;render();});
pad.addEventListener('keyup',event=>{if(keys.has(event.key)){event.preventDefault();zero();}});
pad.addEventListener('blur',zero);
window.addEventListener('blur',zero);
document.addEventListener('visibilitychange',()=>{if(document.hidden){zero();if(connecting)close('连接已取消。');}});
window.addEventListener('pagehide',()=>{zero();close();});
</script></body></html>
