<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>平衡车 · 遥控</title>
<style>
:root{color-scheme:light;--ink:#183831;--paper:#f5f3ec;--line:#d4d9cf;--green:#22634f}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei UI","PingFang SC",sans-serif}main{max-width:480px;margin:auto;padding:40px 28px 28px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:24px}h1{font-size:27px;letter-spacing:.08em;margin:0}header small{display:block;font:11px Consolas,monospace;letter-spacing:.18em;margin-top:9px}button{font:inherit;border:1px solid var(--green);border-radius:6px;padding:11px 18px;background:var(--green);color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,#pad:focus-visible{outline:3px solid #cc8b36;outline-offset:5px}#status{min-height:42px;font-size:13px;line-height:1.6;margin:20px 0;color:#52665c}.directions{text-align:center;font-size:12px;color:#66766a;letter-spacing:.18em}#pad{width:min(100%,300px);aspect-ratio:1;margin:16px auto;position:relative;border:1px solid #bbc8ba;border-radius:50%;touch-action:none;user-select:none;background:linear-gradient(transparent calc(50% - .5px),#d7ded3 50%,transparent calc(50% + .5px)),linear-gradient(90deg,transparent calc(50% - .5px),#d7ded3 50%,transparent calc(50% + .5px));background-color:#e9ede3;outline-offset:7px}#pad[aria-disabled="true"]{opacity:.45}#pad::before{content:"";position:absolute;inset:22%;border:1px dashed #c1cdbd;border-radius:50%}#knob{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px;border-radius:50%;background:var(--green);box-shadow:0 5px 0 #174837,0 8px 16px #18383120;pointer-events:none}#knob::after{content:"+";display:grid;place-items:center;height:100%;color:#c8dfc7;font:24px Consolas,monospace}.readout{display:flex;justify-content:space-between;margin-top:32px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.readout label{font-size:12px;color:#617268}.readout output{display:block;margin-top:8px;font:28px Consolas,monospace}.readout span{font-size:13px}footer{font-size:12px;line-height:1.9;color:#617268;margin-top:20px}footer p{margin:5px 0}@media(max-height:650px){main{padding-top:20px}#pad{width:230px}.readout{margin-top:18px}}
.readout[aria-label]{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.readout[aria-label] output{font-size:clamp(18px,5vw,24px);overflow-wrap:anywhere}
</style>
</head>
<body><main>
<header><div><h1>平衡车</h1><small>VELOCITY / DIRECTION</small></div><button id="connect">连接蓝牙</button></header>
<p id="status" role="status" aria-live="polite">连接后，按住摇杆控制。</p>
<div class="directions">前进</div>
<div id="pad" role="application" tabindex="0" aria-label="方向摇杆；按住拖动，或按住方向键，松开归零" aria-disabled="true"><div id="knob"></div></div>
<div class="directions">后退</div>
<div class="readout"><div><label>速度目标</label><output id="speed">0 <span>%</span></output></div><div><label>转向目标 · 左 / 右</label><output id="direction">0 <span>%</span></output></div></div>
<div class="readout" aria-label="车辆实测"><div><label>俯仰角 °</label><output id="pitch">—</output></div><div><label>左轮 rad/s</label><output id="left">—</output></div><div><label>右轮 rad/s</label><output id="right">—</output></div></div>
<p id="telemetryState" role="status">等待车辆数据</p>
<details open><summary>诊断记录（断开后保留）</summary><pre id="diagnosticLog" style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;font-size:11px" aria-live="polite"></pre></details>
<footer><p>松手归零，保持零速平衡。失焦或切到后台会归零。</p><p>摇杆百分比为发送目标，下方为车辆实测值。数据失效时目标归零；归零不等于关闭电机。</p></footer>
</main>
<script>
'use strict';
const SERVICE='6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const COMMAND='6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const TELEMETRY='6e400007-b5a3-f393-e0a9-e50e24dcca9e';
const DIAGNOSTIC='6e400008-b5a3-f393-e0a9-e50e24dcca9e';
const diagnosticLog=document.getElementById('diagnosticLog'),diagnosticLines=[];
function logDiagnostic(source,text){
 const line=`${new Date().toISOString()} [${source}] ${text}`;
 diagnosticLines.push(line);if(diagnosticLines.length>100)diagnosticLines.shift();
 diagnosticLog.textContent=diagnosticLines.join('\n');console.info(line);
}
function webError(point,error,detail=''){
 logDiagnostic('WEB',`point=0x${point.toString(16)} code=${point===0x620?263:-1} domain=0 raw=${Number.isInteger(error?.code)?error.code:0} name=${error?.name||'Error'} message=${error?.message||error} ${detail}`);
}
async function gattOperation(s,operation,name){
 let soft,hard;const start=performance.now();
 try{
  return await Promise.race([operation(),new Promise((_,reject)=>{
   soft=setTimeout(()=>{if(session===s){center();s.zero=true;logDiagnostic('WEB',`operation=${name} pending_ms=200 目标归零，等待当前GATT操作完成`);}},200);
   hard=setTimeout(()=>{const e=new Error(`${name}超时（1000ms）`);e.point=0x620;reject(e);},1000);
  })]);
 }finally{clearTimeout(soft);clearTimeout(hard);s.lastGattMs=performance.now()-start;s.lastOperation=name;}
}
async function pollDiagnostic(s){
 const value=await gattOperation(s,()=>s.diagnostic.readValue(),'诊断读取');
 if(session!==s)return;
 const text=new TextDecoder().decode(value);
 if(text==='none')return;
 const match=/^seq=(\d+) /.exec(text);
 if(!match){webError(0x621,new Error('诊断格式无效'),text);return;}
 const seq=Number(match[1]);
 if(!s.seenDiagnostics.has(seq)){
  if(s.diagSequence && seq>s.diagSequence+1)logDiagnostic('DEVICE',`事件序号缺口 ${s.diagSequence+1}..${seq-1}，可能已被16条环覆盖`);
  logDiagnostic('DEVICE',text);s.seenDiagnostics.add(seq);s.diagSequence=seq;
  if(s.seenDiagnostics.size>128)s.seenDiagnostics.delete(s.seenDiagnostics.values().next().value);
 }
 if(s.zero)return; // 松手/延迟归零优先于确认，下一轮可重复读取同一事件。
 const ack=new Uint8Array(4);new DataView(ack.buffer).setUint32(0,seq,true);
 await gattOperation(s,()=>s.diagnostic.writeValueWithResponse(ack),'诊断确认');
}
const button=document.getElementById('connect'),status=document.getElementById('status');
const pad=document.getElementById('pad'),knob=document.getElementById('knob');
const speed=document.getElementById('speed'),direction=document.getElementById('direction');
const pitch=document.getElementById('pitch'),left=document.getElementById('left'),right=document.getElementById('right'),telemetryState=document.getElementById('telemetryState');
let session=null,connecting=false,generation=0,pointer=null,x=0,y=0;
const keys=new Set();
function render(){
 speed.innerHTML=`${y} <span>%</span>`;direction.innerHTML=`${x} <span>%</span>`;
 const r=pad.getBoundingClientRect().width/2-34;
 knob.style.transform=`translate(${x*r/100}px,${-y*r/100}px)`;
}
function invalidateTelemetry(s,message){
 if(s.telemetryValid)webError(0x622,new Error(message),`sample_seq=${s.sampleSequence} age_ms=${performance.now()-s.lastSampleAt}`);
 s.telemetryValid=false;pitch.textContent=left.textContent=right.textContent='—';telemetryState.textContent=message;
 center();s.zero=true;
}
function receiveTelemetry(s,event){
 if(s!==session)return;
 const v=event.target.value;
 if(v.byteLength!==20||v.getUint8(0)!==1){invalidateTelemetry(s,'遥测格式不兼容');return;}
 const seq=v.getUint16(2,true),time=v.getUint32(4,true);
 const values=[v.getFloat32(8,true),v.getFloat32(12,true),v.getFloat32(16,true)];
 if(v.getUint8(1)!==1||!values.every(Number.isFinite)){invalidateTelemetry(s,'车辆数据无效或控制已停止');return;}
 if(seq===s.sampleSequence&&time===s.sampleTime)return;
 s.sampleSequence=seq;s.sampleTime=time;s.lastSampleAt=performance.now();s.telemetryValid=true;
 [pitch,left,right].forEach((el,i)=>el.textContent=values[i].toFixed(2));telemetryState.textContent='实测数据更新中';
}
function serviceSession(s){
 if(s!==session)return;
 if(s.telemetryValid&&performance.now()-s.lastSampleAt>=600)invalidateTelemetry(s,'车辆数据已过期，目标已归零');
 void flush(s);
}
function center(){pointer=null;keys.clear();x=y=0;render();}
function close(message='蓝牙已断开。'){
 if(session)logDiagnostic('WEB',`LOCAL_CLOSE message=${message} operation=${session.lastOperation||'none'} duration_ms=${session.lastGattMs||0}`);
 ++generation;const old=session;session=null;center();
 pitch.textContent=left.textContent=right.textContent='—';telemetryState.textContent='等待车辆数据';
 if(old){clearInterval(old.timer);old.device.gatt.disconnect();}
 button.disabled=false;button.textContent='连接蓝牙';pad.setAttribute('aria-disabled','true');status.textContent=message;
}
async function flush(s){
 if(s!==session||s.busy)return;
 s.busy=true;
 try{
  do{
   const zero=s.zero||!s.telemetryValid||document.hidden;s.zero=false;
   const data=new TextEncoder().encode(`${zero?0:x},${zero?0:y}\n`);

   await gattOperation(s,()=>s.characteristic.writeValueWithResponse(data),'命令写入');
   if(s===session&&!s.zero&&performance.now()>=s.nextDiagnosticAt){
    s.nextDiagnosticAt=performance.now()+250;await pollDiagnostic(s);
   }
  }while(s===session&&s.zero);
 }catch(error){if(s===session){webError(error.point||0x621,error,`operation=${s.lastOperation} duration_ms=${s.lastGattMs}`);close(`连接中断：${error.message}`);}}
 finally{s.busy=false;}
}
function zero(){center();if(session){session.zero=true;void flush(session);}}
async function connect(){
 if(session){zero();close();return;}
 if(connecting)return;
 if(!navigator.bluetooth){status.textContent='请使用支持 Web Bluetooth 的浏览器，并通过 HTTPS 或 localhost 打开。';return;}
 connecting=true;button.disabled=true;status.textContent='正在连接…';const token=++generation;let device;
 try{
  device=await navigator.bluetooth.requestDevice({filters:[{name:'平衡车'}],optionalServices:[SERVICE]});
  if(token!==generation||document.hidden)return;
  const server=await device.gatt.connect();
  if(token!==generation||document.hidden){device.gatt.disconnect();return;}
  const service=await server.getPrimaryService(SERVICE);
  const characteristic=await service.getCharacteristic(COMMAND);
  if(token!==generation||document.hidden){device.gatt.disconnect();return;}
  if(!characteristic.properties.write)throw new Error('命令特征不支持带响应写入');
  const telemetry=await service.getCharacteristic(TELEMETRY);
  const diagnostic=await service.getCharacteristic(DIAGNOSTIC);
  if(token!==generation||document.hidden){device.gatt.disconnect();return;}
  const s={device,characteristic,diagnostic,busy:false,zero:true,timer:null,telemetryValid:false,lastSampleAt:0,sampleSequence:null,sampleTime:null,nextDiagnosticAt:0,seenDiagnostics:new Set(),diagSequence:0};session=s;
  telemetry.addEventListener('characteristicvaluechanged',event=>receiveTelemetry(s,event));
  device.addEventListener('gattserverdisconnected',()=>{if(session===s){webError(0x621,new Error('GATT链路断开；浏览器不提供HCI原因码，请重连读取设备事件或查看串口'));close('蓝牙链路已断开，详见诊断记录。');}});
  await telemetry.startNotifications();
  if(s!==session||token!==generation||document.hidden){if(s===session)close();return;}
  center();pad.setAttribute('aria-disabled','false');button.textContent='断开连接';status.textContent='已连接 · 实测数据有效后可操控，松手归零';
  s.timer=setInterval(()=>serviceSession(s),50);await flush(s);
 }catch(error){webError(0x621,error,'operation=connect/discovery/subscribe');if(device?.gatt.connected)device.gatt.disconnect();if(token===generation)close(`连接失败：${error.message}`);}
 finally{connecting=false;button.disabled=false;}
}
function move(event){
 const rect=pad.getBoundingClientRect(),r=rect.width/2-34;
 let dx=event.clientX-rect.left-rect.width/2,dy=rect.top+rect.height/2-event.clientY;
 const scale=Math.max(1,Math.hypot(dx,dy)/r);
 x=Math.round(dx/scale/r*100);y=Math.round(dy/scale/r*100);render();
}
button.addEventListener('click',()=>void connect());
pad.addEventListener('pointerdown',event=>{if(!session||!session.telemetryValid||document.hidden||pointer!==null||event.button!==0)return;event.preventDefault();keys.clear();pointer=event.pointerId;pad.setPointerCapture(pointer);move(event);});
pad.addEventListener('pointermove',event=>{if(pointer===event.pointerId)move(event);});
for(const name of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(name,event=>{if(pointer===event.pointerId)zero();});
pad.addEventListener('keydown',event=>{if(!session||!session.telemetryValid||document.hidden||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();keys.add(event.key);x=(Number(keys.has('ArrowRight'))-Number(keys.has('ArrowLeft')))*50;y=(Number(keys.has('ArrowUp'))-Number(keys.has('ArrowDown')))*50;render();});
pad.addEventListener('keyup',event=>{if(keys.has(event.key)){event.preventDefault();zero();}});
pad.addEventListener('blur',zero);
window.addEventListener('blur',zero);
document.addEventListener('visibilitychange',()=>{if(document.hidden){zero();if(connecting)close('连接已取消。');}});
window.addEventListener('pagehide',()=>{zero();close();});
</script></body></html>
